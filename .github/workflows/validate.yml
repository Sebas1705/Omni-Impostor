name: Validation Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Chooses where the heavy Linux jobs run: the owner's PC (self-hosted runner, see Sebas1705/ci-runner) when its
  # heartbeat variable is under 3 minutes old, otherwise a GitHub-hosted runner. Only push and workflow_dispatch
  # events may use the PC: pull requests and every other event stay on GitHub-hosted runners.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.PC_RUNNER_HEARTBEAT }}
          EVENT: ${{ github.event_name }}
        run: |
          runner='"ubuntu-latest"'
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ -n "${HEARTBEAT:-}" ]; then
            age=$(( $(date +%s) - HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 180 ]; then runner='["self-hosted","pc"]'; fi
          fi
          echo "Runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  release_notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Google Play limits
        run: node scripts/release-notes.mjs --check
  word_lists:
    name: Word Lists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check the word lists match the concept map
        run: node scripts/words/compile.mjs --check
      - name: Check the words version
        run: node scripts/word-study/update-words-version.mjs --check
      - name: Test the word tooling
        run: node --test scripts/words/words.test.mjs scripts/words/edit.test.mjs
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      detekt: ${{ steps.filter.outputs.detekt }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/validate.yml'
            detekt:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'config/detekt/**'
              - '.github/workflows/validate.yml'
            tests:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - '.github/workflows/validate.yml'
  build_lint:
    name: Build + Lint
    needs: [changes, pick-runner]
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Build and Lint
        run: ./gradlew assembleDebug lintDebug --stacktrace --no-daemon --build-cache
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          retention-days: 14
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
  detekt:
    name: Detekt
    needs: [changes, pick-runner]
    if: needs.changes.outputs.detekt == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Run Detekt
        run: ./gradlew detekt --stacktrace --no-daemon --build-cache --configuration-cache
      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          retention-days: 14
          path: |
            **/build/reports/detekt/
  unit_tests:
    name: Unit Tests + Coverage
    needs: [changes, pick-runner]
    if: needs.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Run Unit Tests and Coverage
        run: ./gradlew coverageUnitTestAll --stacktrace --no-daemon --build-cache
      - name: Ensure python3 (self-hosted image)
        if: runner.environment == 'self-hosted'
        run: command -v python3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3; }
      - name: Post coverage to job summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = "build/reports/jacoco/merged/jacocoMergedReport.xml"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          out.write("## Unit test coverage (JaCoCo, merged)\n\n")
          if not os.path.exists(report_path):
              out.write("Merged report not found: the tests failed before `jacocoMergedReport` ran.\n")
              raise SystemExit(0)

          report = ET.parse(report_path).getroot()
          counters = {c.get("type"): (int(c.get("covered")), int(c.get("missed"))) for c in report.findall("counter")}

          def pct(covered, missed):
              total = covered + missed
              return 0.0 if total == 0 else 100.0 * covered / total

          line_covered, line_missed = counters.get("LINE", (0, 0))
          out.write(f"**Total line coverage: {pct(line_covered, line_missed):.2f}%** "
                    f"({line_covered}/{line_covered + line_missed} lines)\n\n")
          out.write("| Counter | Covered | Missed | % |\n|---|---:|---:|---:|\n")
          for name in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              if name in counters:
                  covered, missed = counters[name]
                  out.write(f"| {name} | {covered} | {missed} | {pct(covered, missed):.2f} |\n")
          out.write("\nPer-module and merged HTML reports are in the `test-coverage-reports` artifact.\n")
          PY
      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          retention-days: 14
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
