name: Validation Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      detekt: ${{ steps.filter.outputs.detekt }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/validate.yml'
            detekt:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'config/detekt/**'
              - '.github/workflows/validate.yml'
            tests:
              - 'app/**'
              - 'feature/**'
              - 'core/**'
              - 'domain/**'
              - 'data/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - '.github/workflows/validate.yml'
  build_lint:
    name: Build + Lint
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Build and Lint
        run: ./gradlew assembleDebug lintDebug --stacktrace --no-daemon --build-cache
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          retention-days: 14
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
  detekt:
    name: Detekt
    needs: changes
    if: needs.changes.outputs.detekt == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Run Detekt
        run: ./gradlew detekt --stacktrace --no-daemon --build-cache --configuration-cache
      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          retention-days: 14
          path: |
            **/build/reports/detekt/
  unit_tests:
    name: Unit Tests + Coverage
    needs: changes
    if: needs.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup
      - name: Run Unit Tests and Coverage
        run: ./gradlew coverageUnitTestAll --stacktrace --no-daemon --build-cache
      - name: Post coverage to job summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = "build/reports/jacoco/merged/jacocoMergedReport.xml"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          out.write("## Unit test coverage (JaCoCo, merged)\n\n")
          if not os.path.exists(report_path):
              out.write("Merged report not found: the tests failed before `jacocoMergedReport` ran.\n")
              raise SystemExit(0)

          report = ET.parse(report_path).getroot()
          counters = {c.get("type"): (int(c.get("covered")), int(c.get("missed"))) for c in report.findall("counter")}

          def pct(covered, missed):
              total = covered + missed
              return 0.0 if total == 0 else 100.0 * covered / total

          line_covered, line_missed = counters.get("LINE", (0, 0))
          out.write(f"**Total line coverage: {pct(line_covered, line_missed):.2f}%** "
                    f"({line_covered}/{line_covered + line_missed} lines)\n\n")
          out.write("| Counter | Covered | Missed | % |\n|---|---:|---:|---:|\n")
          for name in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              if name in counters:
                  covered, missed = counters[name]
                  out.write(f"| {name} | {covered} | {missed} | {pct(covered, missed):.2f} |\n")
          out.write("\nPer-module and merged HTML reports are in the `test-coverage-reports` artifact.\n")
          PY
      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          retention-days: 14
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
