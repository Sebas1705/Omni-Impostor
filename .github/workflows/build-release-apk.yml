name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to upload APK to (e.g. v1.1.3)"
        required: true
        default: "v1.1.3"

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create secrets.properties
        run: |
          mkdir -p app
          cat > app/secrets.properties <<PROPS
          signing_keystore_password=${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          signing_key_alias=${{ secrets.SIGNING_KEY_ALIAS }}
          EXAMPLE_URL_DEV=${{ secrets.EXAMPLE_URL_DEV || 'https://dev.example.com' }}
          EXAMPLE_URL_PRO=${{ secrets.EXAMPLE_URL_PRO || 'https://pro.example.com' }}
          PROPS

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon --build-cache

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.event.inputs.release_tag }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
