name: Build & Publish Release AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release en GitHub (ej. v1.1.3)"
        required: true
        default: "v1.1.3"
      build_type:
        description: "Tipo de build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build_aab:
    name: Build AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Create app files from Doppler secrets (release)
        if: github.event.inputs.build_type == 'release'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          mkdir -p app

          eval "$(doppler secrets download --no-file --format env)"

          {
            echo "signing_keystore_file=keystore.jks"
            echo "signing_key_alias=$SIGNING_KEY_ALIAS"
            echo "signing_keystore_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "signing_key_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "EXAMPLE_URL_DEV=$EXAMPLE_URL_DEV"
            echo "EXAMPLE_URL_PRO=$EXAMPLE_URL_PRO"
          } > app/secrets.properties

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Create app files stub (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          {
            echo "signing_keystore_file=keystore.jks"
            echo "signing_key_alias=debug"
            echo "signing_keystore_password=debug"
            echo "signing_key_password=debug"
            echo "EXAMPLE_URL_DEV=https://dev.example.com"
            echo "EXAMPLE_URL_PRO=https://pro.example.com"
          } > app/secrets.properties

          echo '' | base64 --decode > app/google-services.json

      - name: Set up Gradle 9 (latest stable)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Build Pro Release AAB
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew :app:bundleProRelease --stacktrace --no-daemon --build-cache

      - name: Build Dev Debug APK (smoke test)
        if: github.event.inputs.build_type == 'debug'
        run: ./gradlew :app:assembleDevDebug --stacktrace --no-daemon --build-cache

      - name: Locate output file
        id: output
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            FILE=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          else
            FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $FILE"

      - name: Upload to GitHub Release
        if: steps.output.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.output.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact
        if: steps.output.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-aab-${{ github.event.inputs.release_tag }}
          path: ${{ steps.output.outputs.path }}
          retention-days: 30
