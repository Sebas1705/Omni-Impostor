name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to upload APK to (e.g. v1.1.3)"
        required: true
        default: "v1.1.3"
      build_type:
        description: "Build type: debug or release (release requires keystore secrets)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/1.1.3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up latest stable Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version current --distribution-type bin

      - name: Decode keystore (release only)
        if: github.event.inputs.build_type == 'release'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create secrets.properties (release)
        if: github.event.inputs.build_type == 'release'
        run: |
          mkdir -p app
          cat > app/secrets.properties << EOF
          signing_keystore_password=${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          signing_key_alias=${{ secrets.SIGNING_KEY_ALIAS }}
          EXAMPLE_URL_DEV=${{ secrets.EXAMPLE_URL_DEV || 'https://dev.example.com' }}
          EXAMPLE_URL_PRO=${{ secrets.EXAMPLE_URL_PRO || 'https://pro.example.com' }}
          EOF

      - name: Create secrets.properties (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          {
            echo "signing_keystore_password=debug"
            echo "signing_key_alias=debug"
            echo "EXAMPLE_URL_DEV=https://dev.example.com"
            echo "EXAMPLE_URL_PRO=https://pro.example.com"
          } > app/secrets.properties

      - name: Create stub google-services.json (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          cat > app/google-services.json << 'ENDOFFILE'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "impostor-debug",
              "storage_bucket": "impostor-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "es.sebas1705.impostorgame"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaStubKeyForCIDebugBuildOnly00000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          ENDOFFILE

      - name: Create google-services.json (release)
        if: github.event.inputs.build_type == 'release'
        run: |
          mkdir -p app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon --build-cache
          else
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --build-cache
          fi

      - name: Locate APK
        id: apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-apk-${{ github.event.inputs.release_tag }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
