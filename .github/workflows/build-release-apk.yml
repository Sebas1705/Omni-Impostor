name: Build & Publish Release AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release en GitHub (ej. v1.1.3)"
        required: true
        default: "v1.1.3"
      build_type:
        description: "Tipo de build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build_aab:
    name: Build AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release/1.1.3
        uses: actions/checkout@v4
        with:
          ref: release/1.1.3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Create secrets.properties (release)
        if: github.event.inputs.build_type == 'release'
        run: |
          mkdir -p app
          {
            echo "signing_keystore_password=${{ secrets.SIGNING_KEYSTORE_PASSWORD }}"
            echo "signing_key_alias=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "EXAMPLE_URL_DEV=${{ secrets.EXAMPLE_URL_DEV }}"
            echo "EXAMPLE_URL_PRO=${{ secrets.EXAMPLE_URL_PRO }}"
          } > app/secrets.properties

      - name: Create secrets.properties (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          {
            echo "signing_keystore_password=debug"
            echo "signing_key_alias=debug"
            echo "EXAMPLE_URL_DEV=https://dev.example.com"
            echo "EXAMPLE_URL_PRO=https://pro.example.com"
          } > app/secrets.properties

      - name: Decode keystore (release)
        if: github.event.inputs.build_type == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create google-services.json (release)
        if: github.event.inputs.build_type == 'release'
        run: |
          mkdir -p app
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Create stub google-services.json (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          echo '' | base64 --decode > app/google-services.json

      - name: Set up Gradle 9 (latest stable)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Build Pro Release AAB
        if: github.event.inputs.build_type == 'release'
        run: gradle :app:bundleProRelease --stacktrace --no-daemon --build-cache

      - name: Build Dev Debug APK (smoke test)
        if: github.event.inputs.build_type == 'debug'
        run: gradle :app:assembleDevDebug --stacktrace --no-daemon --build-cache

      - name: Locate output file
        id: output
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            FILE=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          else
            FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $FILE"

      - name: Upload to GitHub Release
        if: steps.output.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.output.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact
        if: steps.output.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-aab-${{ github.event.inputs.release_tag }}
          path: ${{ steps.output.outputs.path }}
          retention-days: 30
