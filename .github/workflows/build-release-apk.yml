name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to upload APK to (e.g. v1.1.3)"
        required: true
        default: "v1.1.3"
      build_type:
        description: "Build type: release (requires keystore secrets) or debug"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/1.1.3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore (release only)
        if: github.event.inputs.build_type == 'release'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create secrets.properties (release)
        if: github.event.inputs.build_type == 'release'
        env:
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          URL_DEV: ${{ secrets.EXAMPLE_URL_DEV }}
          URL_PRO: ${{ secrets.EXAMPLE_URL_PRO }}
        run: |
          mkdir -p app
          printf 'signing_keystore_password=%s\nsigning_key_alias=%s\nEXAMPLE_URL_DEV=%s\nEXAMPLE_URL_PRO=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "${URL_DEV:-https://dev.example.com}" "${URL_PRO:-https://pro.example.com}" \
            > app/secrets.properties

      - name: Create secrets.properties (debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          mkdir -p app
          printf 'signing_keystore_password=debug\nsigning_key_alias=debug\nEXAMPLE_URL_DEV=https://dev.example.com\nEXAMPLE_URL_PRO=https://pro.example.com\n' \
            > app/secrets.properties

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease --stacktrace --no-daemon --build-cache
          else
            gradle :app:assembleDebug --stacktrace --no-daemon --build-cache
          fi

      - name: Locate APK
        id: apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-apk-${{ github.event.inputs.release_tag }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
