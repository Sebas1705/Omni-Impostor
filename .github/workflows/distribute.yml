name: Distribute (Firebase App Distribution)

# Intermediate builds: every push to develop builds the Dev release APK (signed with the release key)
# and sends it to the `testers` group in Firebase App Distribution. Official releases still go through
# release.yml / Play Store. All credentials come from Doppler (secret `DOPPLER_TOKEN` is the only GitHub secret).
# One-time setup of the Firebase side: docs/firebase-distribution.md

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      groups:
        description: "App Distribution groups (comma separated)"
        required: false
        default: "testers"
      release_notes:
        description: "Release notes (default: last commits)"
        required: false

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    name: Build Dev release and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load secrets from Doppler
        id: secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          eval "$(doppler secrets download --no-file --format env)"

          if [ -z "${FIREBASE_DISTRIBUTION_SERVICE_ACCOUNT_JSON:-}" ] || [ -z "${FIREBASE_APP_ID_DEV:-}" ]; then
            echo "::notice::Firebase distribution is not configured in Doppler (FIREBASE_DISTRIBUTION_SERVICE_ACCOUNT_JSON / FIREBASE_APP_ID_DEV). Skipping. See docs/firebase-distribution.md"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "signing_keystore_file=keystore.jks"
            echo "signing_key_alias=$SIGNING_KEY_ALIAS"
            echo "signing_keystore_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "signing_key_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "EXAMPLE_URL_DEV=$EXAMPLE_URL_DEV"
            echo "EXAMPLE_URL_PRO=$EXAMPLE_URL_PRO"
          } > app/secrets.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          printf '%s' "$FIREBASE_DISTRIBUTION_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "app_id=$FIREBASE_APP_ID_DEV" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        if: steps.secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Dev release APK
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevRelease \
            -Pci.versionCode=${{ github.run_number }} \
            -Pci.versionNameSuffix=-dev.${{ github.run_number }} \
            --stacktrace --no-daemon

      - name: Distribute to Firebase App Distribution
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          APP_ID: ${{ steps.secrets.outputs.app_id }}
          GROUPS_INPUT: ${{ github.event.inputs.groups }}
          NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' -path '*Dev*release*' | head -n 1)"
          test -n "$APK" || { echo "::error::Dev release APK not found"; exit 1; }
          NOTES="${NOTES_INPUT:-$(git log -5 --pretty='- %s' )}"
          npx --yes firebase-tools@15 appdistribution:distribute "$APK" \
            --app "$APP_ID" \
            --groups "${GROUPS_INPUT:-testers}" \
            --release-notes "$NOTES"

      - name: Remove credentials
        if: always()
        shell: bash
        run: rm -f app/secrets.properties app/google-services.json app/keystore.jks "$RUNNER_TEMP/firebase-sa.json"
