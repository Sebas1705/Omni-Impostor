name: dependency-report-monthly

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: dependency-report-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android CI Setup
        uses: ./.github/actions/android-ci-setup

      - name: Generate dependency report
        run: ./gradlew dependencyUpdates --no-parallel --no-daemon

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/report.txt
