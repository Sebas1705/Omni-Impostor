name: Publish to Play Store

# Triggers on any vMAJOR.MINOR.PATCH tag pushed to main.
# Runs in parallel with release.yml (GitHub Release notes).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: publish-play-store-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Play Store (internal track)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Safety: verify the tag belongs to main ────────────────────────────
      - name: Verify tag is reachable from main
        run: |
          git fetch origin main --quiet
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag commit is on main history."
          else
            echo "Tag commit is not reachable from origin/main. Aborting."
            exit 1
          fi

      # ── Java + Gradle ─────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # ── Secrets via Doppler ───────────────────────────────────────────────
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Inject secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          mkdir -p app
          eval "$(doppler secrets download --no-file --format env)"

          # secrets.properties (signing + URLs)
          {
            echo "signing_keystore_file=keystore.jks"
            echo "signing_key_alias=$SIGNING_KEY_ALIAS"
            echo "signing_keystore_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "signing_key_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "EXAMPLE_URL_DEV=$EXAMPLE_URL_DEV"
            echo "EXAMPLE_URL_PRO=$EXAMPLE_URL_PRO"
          } > app/secrets.properties

          printf '%s' "$GOOGLE_SERVICES_JSON"          > app/google-services.json
          echo   "$KEYSTORE_BASE64" | base64 --decode   > app/keystore.jks

          # Write Play Store service-account JSON to a temp file so the
          # upload action can read it without exposing it in env vars.
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > /tmp/play-service-account.json

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Pro Release AAB
        run: ./gradlew :app:bundleProRelease --no-daemon --build-cache --stacktrace

      # ── Upload to Play Store ───────────────────────────────────────────────
      # Track: internal  → visible only to internal testers.
      # Promote to alpha/beta/production in Play Console when ready.
      - name: Upload AAB to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/play-service-account.json
          packageName: es.sebas1705.impostorandroidgame
          releaseFiles: app/build/outputs/bundle/proRelease/*.aab
          track: internal
          status: completed
          releaseName: ${{ github.ref_name }}
          changesNotSentForReview: false

      # ── Clean up sensitive files ───────────────────────────────────────────
      - name: Remove sensitive files
        if: always()
        run: |
          rm -f app/secrets.properties app/google-services.json app/keystore.jks
          rm -f /tmp/play-service-account.json
