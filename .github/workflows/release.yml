name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix, for example 1.2.0"
        required: true
        type: string
# A single global release slot: prevents the dispatch-created tag from
# triggering a second parallel run that races with the dispatch run itself.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      released: ${{ steps.released.outputs.value }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Tag
        id: tag
        shell: bash
        run: |
          git fetch origin --tags --quiet
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            if [[ "$RAW" == v* ]]; then
              TAG="$RAW"
            else
              TAG="v$RAW"
            fi
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "Tag $TAG already exists on origin."
              echo "defer_to_push=false" >> "$GITHUB_OUTPUT"
            else
              git tag "$TAG"
              git push origin "$TAG"
              echo "defer_to_push=true" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "defer_to_push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Validate Tag Format
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v1.2.0)"
            exit 1
          fi
      - name: Wait for tag-push workflow when dispatch created the tag
        if: steps.tag.outputs.defer_to_push == 'true'
        shell: bash
        run: |
          echo "Tag ${{ steps.tag.outputs.value }} was pushed during workflow_dispatch."
          echo "The tag-push triggered release workflow will continue the publish flow."
      - name: Verify Tag Commit Is On Main
        if: steps.tag.outputs.defer_to_push != 'true'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          git fetch origin main --quiet
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag commit belongs to main history."
          else
            echo "Tag commit is not reachable from origin/main."
            exit 1
          fi
      - name: Determine Previous Tag
        if: steps.tag.outputs.defer_to_push != 'true'
        id: previous_tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PREVIOUS_TAG=$(git for-each-ref --sort=-version:refname --format='%(refname:short)' refs/tags | grep -Fxv "$TAG" | head -n 1 || true)
          echo "value=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
      - name: Generate Release Notes
        if: steps.tag.outputs.defer_to_push != 'true'
        id: release_notes
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.tag.outputs.value }}
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.value }}
        with:
          result-encoding: string
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              target_commitish: 'main',
            };
            if (process.env.PREVIOUS_TAG) {
              params.previous_tag_name = process.env.PREVIOUS_TAG;
            }
            const { data } = await github.rest.repos.generateReleaseNotes(params);
            return data.body;
      - name: Persist Release Notes
        if: steps.tag.outputs.defer_to_push != 'true'
        shell: bash
        run: |
          cat <<'EOF' > .release-notes.md
          ${{ steps.release_notes.outputs.result }}
          EOF
      - name: Prepare Main Branch For CHANGELOG Update
        if: steps.tag.outputs.defer_to_push != 'true'
        shell: bash
        run: |
          git fetch origin main --quiet
          git checkout main
          git pull --ff-only origin main
      - name: Update CHANGELOG.md
        if: steps.tag.outputs.defer_to_push != 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.value }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          from datetime import datetime, timezone
          changelog_path = Path('CHANGELOG.md')
          tag = os.environ['TAG_NAME']
          notes = Path('.release-notes.md').read_text(encoding='utf-8').strip()
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          unreleased = "## [Unreleased]\n\n"
          existing = changelog_path.read_text(encoding='utf-8')
          if f"## [{tag}] - " in existing:
            print(f"CHANGELOG already contains {tag}; skipping update.")
            raise SystemExit(0)
          pattern = re.compile(r"## \[Unreleased\].*?(?=\n## \[|\Z)", re.DOTALL)
          match = pattern.search(existing)
          # Whatever piled up under Unreleased moves into this version: there is no bump PR to do it.
          pending = match.group(0)[len(unreleased.rstrip()):].strip() if match else ""
          entry = f"## [{tag}] - {today}\n\n" + (f"{pending}\n\n" if pending else "") + f"{notes}\n\n"
          if match:
            updated = existing[:match.start()] + unreleased.rstrip() + existing[match.end():]
          else:
            updated = existing.rstrip() + "\n\n" + unreleased.rstrip() + "\n"
          marker = unreleased.rstrip()
          updated = updated.replace(marker, marker + "\n\n" + entry.rstrip(), 1)
          changelog_path.write_text(updated.rstrip() + "\n", encoding='utf-8')
          PY
      - name: Commit CHANGELOG.md
        if: steps.tag.outputs.defer_to_push != 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.value }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update ${TAG_NAME} release notes"
          git push origin HEAD:main
      - name: Publish GitHub Release
        if: steps.tag.outputs.defer_to_push != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          body_path: .release-notes.md
      - name: Mark as released
        if: steps.tag.outputs.defer_to_push != 'true'
        id: released
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  build_aab:
    name: Build & Attach Release AAB
    runs-on: ubuntu-latest
    needs: publish_release
    if: needs.publish_release.outputs.released == 'true'
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      # Explicit ref: a manual run would otherwise build main. The full history is what the
      # versionCode counts.
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.publish_release.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Inject secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          mkdir -p app
          eval "$(doppler secrets download --no-file --format env)"
          {
            echo "signing_keystore_file=keystore.jks"
            echo "signing_key_alias=$SIGNING_KEY_ALIAS"
            echo "signing_keystore_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "signing_key_password=$SIGNING_KEYSTORE_PASSWORD"
            echo "EXAMPLE_URL_DEV=$EXAMPLE_URL_DEV"
            echo "EXAMPLE_URL_PRO=$EXAMPLE_URL_PRO"
          } > app/secrets.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # versionName is the tag, versionCode the commits of the tag: it grows with every tag, as tags
      # must be on main. Play already has 7, and a shallow checkout would count far fewer commits.
      - name: Resolve Version
        id: version
        shell: bash
        env:
          TAG: ${{ needs.publish_release.outputs.tag }}
        run: |
          CODE=$(git rev-list --count HEAD)
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ] || [ "$CODE" -le 7 ]; then
            echo "::error::versionCode $CODE is not above 7 or the checkout is shallow"
            exit 1
          fi
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build Pro Release AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :app:bundleProRelease -Pci.versionName="$VERSION_NAME" -Pci.versionCode="$VERSION_CODE" \
            --no-daemon --build-cache --stacktrace

      - name: Attach AAB to GitHub Release
        env:
          TAG: ${{ needs.publish_release.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish_release.outputs.tag }}
          files: app/build/outputs/bundle/**/*.aab
          fail_on_unmatched_files: true

      - name: Hand the bundle to the Play job
        if: vars.PLAY_TRACK != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          retention-days: 1
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/ProRelease/*.aab
            app/build/outputs/mapping/ProRelease/mapping.txt

  # Nothing runs until the repository variable PLAY_TRACK names a track: docs/play-release.md. It is
  # its own job so fastlane and its gems never share a runner with the signing key or a write token.
  # The default status is draft because this is a live app: a tag must not reach users by itself,
  # above all with PLAY_TRACK=production, where `completed` would mean 100 % at once. Publishing a
  # draft is one run of play-promote.yml; PLAY_RELEASE_STATUS=completed is for testing tracks.
  publish_play:
    name: Upload to Google Play
    runs-on: ubuntu-latest
    needs: [publish_release, build_aab]
    if: vars.PLAY_TRACK != ''
    timeout-minutes: 20
    concurrency:
      group: play
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.publish_release.outputs.tag }}
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: play-bundle
          path: play-bundle

      - name: Prepare the upload
        id: play
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish_release.outputs.tag }}
          VERSION_NAME: ${{ needs.build_aab.outputs.version_name }}
          VERSION_CODE: ${{ needs.build_aab.outputs.version_code }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          [[ "$PLAY_TRACK" =~ ^[a-z0-9:_.-]+$ ]] || { echo "::error::Invalid PLAY_TRACK"; exit 1; }
          case "$PLAY_RELEASE_STATUS" in
            draft|completed) ;;
            *) echo "::error::PLAY_RELEASE_STATUS must be draft or completed"; exit 1 ;;
          esac
          AAB=$(find play-bundle/bundle -name '*.aab' | head -n 1)
          test -n "$AAB" || { echo "::error::No AAB in the artifact"; exit 1; }
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/release-body.md"
          node scripts/release-notes.mjs "$VERSION_NAME" "$RUNNER_TEMP/release-body.md" "$RUNNER_TEMP/play-metadata" "$VERSION_CODE"
          ARGS="--aab $AAB --track $PLAY_TRACK --release_status $PLAY_RELEASE_STATUS"
          ARGS="$ARGS --metadata_path $RUNNER_TEMP/play-metadata --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true"
          MAPPING=play-bundle/mapping/ProRelease/mapping.txt
          if [ -f "$MAPPING" ]; then ARGS="$ARGS --mapping $MAPPING"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        uses: ./.github/actions/play
        with:
          args: ${{ steps.play.outputs.args }}
