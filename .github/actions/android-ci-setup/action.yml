name: Android CI Setup
description: Validates the Gradle wrapper, sets up JDK 21 and Gradle cache, writes a secrets stub, and makes gradlew executable.
runs:
  using: composite
  steps:
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Create secrets stub
      shell: bash
      run: |
        mkdir -p app
        echo "signing_keystore_password=fake" > app/secrets.properties
        echo "signing_key_alias=fake" >> app/secrets.properties
        echo "EXAMPLE_URL_DEV=https://dev.example.com" >> app/secrets.properties
        echo "EXAMPLE_URL_PRO=https://pro.example.com" >> app/secrets.properties
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
